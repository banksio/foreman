[package]
name = "foreman"
version = "0.1.1"
edition = "2024"
license = "MIT"
description = "Local maintenance for Debian-family hosts"
repository = "https://github.com/banksio/foreman"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
libc = "0.2"
regex = "1"
schemars = { version = "1", features = ["chrono04"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
signal-hook = "0.3"
tempfile = "3"
toml = "0.9"
toml_edit = "0.23"
